<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave Calculator</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #4facfe;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2196f3;
    }

    .result {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Leave Calculator</h2>

    <input type="number" id="balance" step="0.01" placeholder="Enter balance (e.g. 2.90)">
    <input type="number" id="hours" step="0.1" placeholder="Enter hours (e.g. 3)">

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculate() {
      let balance = parseFloat(document.getElementById("balance").value);
      let hours = parseFloat(document.getElementById("hours").value);

      const dayHours = 9;

      // convert hours to days
      let deductedDays = hours / dayHours;

      // remaining balance
      let remaining = balance - deductedDays;

      // show clean result (2 decimals like 2.57)
      document.getElementById("result").innerText =
        "Remaining balance: " + remaining.toFixed(2) + " days";
    }
  </script>

</body>
</html>
